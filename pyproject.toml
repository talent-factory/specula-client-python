[project]
name = "specula-client"
version = "0.1.2"
description = "Shared Specula-Observability-Client (OTel-Setup, Logging, PII-Scrubbing) fuer Talent-Factory-Produkte"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Daniel Senften", email = "daniel.senften@talent-factory.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    # SpeculaLogHandler (TF-850) postet den OTLP/HTTP-Logs-Payload hand-gerollt statt ueber
    # das OTel-Logs-SDK - httpx ist daher eine Kern-Abhaengigkeit, nicht instrumentierungs-
    # spezifisch wie die fastapi/celery-Extras.
    "httpx>=0.27",
]
classifiers = [
    "Private :: Do Not Upload",
]

# Instrumentierungs-Extras: FastAPI/Celery bleiben optional, damit Konsumenten ohne
# diese Frameworks (z.B. ein reiner Worker ohne FastAPI) keine ungenutzten
# Abhaengigkeiten mitziehen (TF-849).
[project.optional-dependencies]
fastapi = [
    "fastapi>=0.115",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]
celery = [
    "celery>=5.4",
    "opentelemetry-instrumentation-celery>=0.49b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "specula-client[fastapi,celery]",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
