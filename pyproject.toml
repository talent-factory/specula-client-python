[project]
name = "specula-client"
version = "0.1.0"
description = "Shared Specula-Observability-Client (OTel-Setup, Logging, PII-Scrubbing) fuer Talent-Factory-Produkte"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Daniel Senften", email = "daniel.senften@talent-factory.ch" }
]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Private :: Do Not Upload",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
